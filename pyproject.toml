[project]
name = "spectrafuse"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.162.7",
    "pandas==3.1.1",
    "pyarrow==26.0.1",
    "python-dotenv==1.2.4",
    "requests==2.34.2",
]

[tool.vercel]
entrypoint = "backend.main:app"

[tool.pyrefly]
search-path = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]

